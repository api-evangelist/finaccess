name: Finaccess
description: Finaccess Mexico, S.A. de C.V., Sociedad Operadora de Fondos de Inversion, is an independent
  Mexican investment-fund operator (asset manager) authorized by the CNBV and the SHCP and regulated by
  Banco de Mexico. Founded in 2000 and headquartered in Mexico City, it is part of Grupo Finaccess and
  operates under the tagline "Acceso financiero para todos" (financial access for everyone). Finaccess
  manages the AXES family of mutual funds spanning short/medium/long-term local debt (AXES CP, MP, LP),
  domestic and international equity (AXES BMV, GLO, GSP, USA), dollar-denominated debt (AXES COB), and ESG
  equity (AXES ESG), and it distributes third-party funds from Franklin Templeton, Santander, and
  Scotiabank. It provides model portfolios, published rate-of-return tracking, and Morningstar-rated fund
  evaluation for retail and institutional clients. Finaccess publishes no public developer API; this
  profile carries company identity and domain-security enrichment only.
